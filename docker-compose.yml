version: "3.8"

services:

  mysql:
    image: mysql:8
    container_name: transactions-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rotondwa
      MYSQL_DATABASE: transactions
    ports:
      - "3306:3306"
    networks:
      - app-network
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: transactions-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/transactions
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rotondwa
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: transactions-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:

volumes:
  mysql_data: